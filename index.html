     <body>
    <div id="root"></div>

    <div id="app-loader">
      <img src="/logo-removebg-preview.png" alt="Loading" id="app-loader-logo" />
      <div id="app-loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0f172a;
        transition: opacity 0.4s ease;
      }
      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader-logo {
        width: 180px;
        max-width: 60vw;
        animation: app-loader-pulse 1.6s ease-in-out infinite;
      }
      #app-loader-dots {
        display: flex;
        gap: 8px;
      }
      #app-loader-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.3;
        animation: app-loader-dot 1.2s ease-in-out infinite;
      }
      #app-loader-dots span:nth-child(2) { animation-delay: 0.2s; }
      #app-loader-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes app-loader-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.96); }
      }
      @keyframes app-loader-dot {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
